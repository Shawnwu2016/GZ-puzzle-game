// ═══════════════════════════════════════════════════════
// 拼图引擎
// ═══════════════════════════════════════════════════════
function countInversions(arr) {
  let inv = 0;
  for (let i = 0; i < arr.length; i++)
    for (let j = i + 1; j < arr.length; j++)
      if (arr[i] && arr[j] && arr[i] > arr[j]) inv++;
  return inv;
}

function isSolvable(tiles, size) {
  const inv = countInversions(tiles);
  if (size % 2 === 1) return inv % 2 === 0;
  const emptyRow = Math.floor(tiles.indexOf(0) / size);
  const fromBottom = size - emptyRow;
  return (inv + fromBottom) % 2 === 1;
}

function shuffleTiles(size) {
  const n = size * size;
  let tiles;
  do {
    tiles = Array.from({length:n}, (_,i) => (i+1) % n);
    for (let i = n-1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
    }
    if (!isSolvable(tiles, size)) {
      const a = tiles[0] === 0 ? 1 : 0;
      const b = tiles[1] === 0 ? 2 : 1;
      [tiles[a], tiles[b]] = [tiles[b], tiles[a]];
    }
  } while (tiles.every((v,i) => v === (i+1) % n));
  return tiles;
}

function isComplete(tiles) {
  return tiles.every((v,i) => v === (i+1) % tiles.length);
}

function isAdjacent(idx, emptyIdx, size) {
  const r1 = Math.floor(idx/size), c1 = idx%size;
  const r2 = Math.floor(emptyIdx/size), c2 = emptyIdx%size;
  return (Math.abs(r1-r2) + Math.abs(c1-c2)) === 1;
}

// localStorage 存取
const STORAGE_KEY = "ganzhou-puzzle-v1";
function loadProgress() {

function fmtTime(s) {
  const m = Math.floor(s/60);
  return `${String(m).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
}

// ═══════════════════════════════════════════════════════
// SceneTile — 带 SVG 背景切片的方块
// ═══════════════════════════════════════════════════════
const SceneTile = memo(({value, index, size, boardPx, isMovable, onClick, sceneId}) => {
  if (value === 0) return null;
  const gap = 2;
  const tileSize = (boardPx - (size+1)*gap) / size;
  const row = Math.floor(index/size), col = index%size;
  const srcRow = Math.floor((value-1)/size), srcCol = (value-1)%size;
  const x = col*(tileSize+gap) + gap;
  const y = row*(tileSize+gap) + gap;
  const SceneComp = SCENES[sceneId];

  return (
    <div
      onClick={() => onClick(index)}
      style={{
        position:"absolute",
        width:tileSize, height:tileSize,
        left:x, top:y,
        transition:"left 0.14s ease-out, top 0.14s ease-out, box-shadow 0.15s",
        borderRadius:5,
        overflow:"hidden",
        cursor: isMovable ? "pointer" : "default",
        boxShadow: isMovable
          ? "0 3px 14px rgba(0,0,0,0.24), 0 0 0 2px rgba(196,151,59,0.4)"
          : "0 1px 4px rgba(0,0,0,0.14)",
        zIndex: isMovable ? 2 : 1,
        transform: isMovable ? "scale(1.015)" : "scale(1)",
        touchAction:"manipulation",
        userSelect:"none",
      }}
    >
      <div style={{
        width: boardPx - gap*2,
        height: boardPx - gap*2,
        position:"absolute",
        left: -(srcCol*(tileSize+gap)),
        top: -(srcRow*(tileSize+gap)),
        pointerEvents:"none",
      }}>
        {SceneComp && <SceneComp/>}
      </div>
    </div>
  );
});

    </div>
  );
}

// ═══════════════════════════════════════════════════════
// 游戏页面
// ═══════════════════════════════════════════════════════
function GamePage({level, chapter, onBack, onComplete}) {
  const [tiles, setTiles] = useState(() => shuffleTiles(level.grid));
  const [moves, setMoves] = useState(0);
  const [history, setHistory] = useState([]);
  const [seconds, setSeconds] = useState(0);
  const [started, setStarted] = useState(false);
  const [done, setDone] = useState(false);
  const [showPreview, setShowPreview] = useState(false);
  const timerRef = useRef(null);
  const touchRef = useRef(null);
  const [boardPx, setBoardPx] = useState(340);

  const size = level.grid;
  const emptyIdx = tiles.indexOf(0);

  // 计时
  useEffect(()=>{
    if (started && !done) {
      timerRef.current = setInterval(()=>setSeconds(s=>s+1), 1000);
    }
    return ()=>clearInterval(timerRef.current);
  }, [started, done]);

  // 面板尺寸响应式
  useEffect(()=>{
    const calc = ()=>{
      const w = Math.min(window.innerWidth-32, 500);
      const h = window.innerHeight - 230;
      setBoardPx(Math.min(w, h, 500));
    };
    calc();
    window.addEventListener("resize", calc);
    return ()=>window.removeEventListener("resize", calc);
  }, []);

  const handleClick = useCallback((idx)=>{
    if (done) return;
    if (!isAdjacent(idx, emptyIdx, size)) return;
    if (!started) setStarted(true);
    setHistory(h=>[...h, tiles.slice()]);
    setTiles(prev=>{
      const next = [...prev];
      [next[idx], next[emptyIdx]] = [next[emptyIdx], next[idx]];
      if (isComplete(next)) {
        setDone(true);
        clearInterval(timerRef.current);
      }
      return next;
    });
    setMoves(m=>m+1);
  }, [emptyIdx, size, started, done, tiles]);

  const handleUndo = ()=>{
    if (!history.length) return;
    setTiles(history[history.length-1]);
    setHistory(h=>h.slice(0,-1));
    setMoves(m=>Math.max(0,m-1));
  };

  const handleReset = ()=>{
    setTiles(shuffleTiles(size));
    setMoves(0); setHistory([]); setSeconds(0);
    setStarted(false); setDone(false);
  };

  // 键盘支持
  useEffect(()=>{
    const handler=(e)=>{
      if (done) return;
      const r=Math.floor(emptyIdx/size), c=emptyIdx%size;
      let target=-1;
      if (e.key==="ArrowUp" && r<size-1) target=emptyIdx+size;
      if (e.key==="ArrowDown" && r>0) target=emptyIdx-size;
      if (e.key==="ArrowLeft" && c<size-1) target=emptyIdx+1;
      if (e.key==="ArrowRight" && c>0) target=emptyIdx-1;
      if (target>=0){ e.preventDefault(); handleClick(target); }
    };
    window.addEventListener("keydown", handler);
    return ()=>window.removeEventListener("keydown", handler);
  }, [emptyIdx, size, done, handleClick]);

  // 触摸滑动
  const handleTouchStart = (e)=>{
    touchRef.current = {x:e.touches[0].clientX, y:e.touches[0].clientY};
  };
  const handleTouchEnd = (e)=>{
    if (!touchRef.current || done) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.max(Math.abs(dx),Math.abs(dy)) < 18) return;
    const r=Math.floor(emptyIdx/size), c=emptyIdx%size;
    let target=-1;
    if (Math.abs(dx)>Math.abs(dy)){
      if (dx>0 && c>0) target=emptyIdx-1;
      if (dx<0 && c<size-1) target=emptyIdx+1;
    } else {
      if (dy>0 && r>0) target=emptyIdx-size;
      if (dy<0 && r<size-1) target=emptyIdx+size;
    }
    if (target>=0) handleClick(target);
    touchRef.current=null;
  };

  const movableIndices = [];
  for (let i=0; i<tiles.length; i++)
    if (tiles[i]!==0 && isAdjacent(i, emptyIdx, size)) movableIndices.push(i);

  const currentStars = moves<=level.stars[2] ? 3 : moves<=level.stars[1] ? 2 : 1;

  return (
    <div className="min-h-screen flex flex-col" style={{background:C.bg, userSelect:"none"}}>
      {/* 顶栏 */}
      <div className="flex items-center px-4 py-3 gap-3"
        style={{background:C.cream, borderBottom:`1px solid ${C.gold}18`}}>
        <button onClick={onBack} className="text-xl active:scale-90 transition-transform p-1" style={{color:C.ink}}>←</button>
        <div className="flex-1 min-w-0">
          <div className="text-sm font-bold truncate" style={{color:C.ink}}>{level.title}</div>
          <div className="text-xs" style={{color:C.tile}}>{chapter.subtitle}</div>
        </div>
        <div className="text-right flex-shrink-0">
          <div className="text-sm font-mono font-bold" style={{color:C.ink}}>{fmtTime(seconds)}</div>
          <div className="text-xs" style={{color:C.tile}}>步数 {moves}</div>
        </div>
      </div>

      {/* 星级提示 */}
      <div className="flex justify-center py-1.5 gap-3 text-xs" style={{color:C.tile}}>
        <span style={{color:currentStars>=1?C.gold:"#ccc"}}>⭐≤{level.stars[0]}</span>
        <span style={{color:currentStars>=2?C.gold:"#ccc"}}>⭐⭐≤{level.stars[1]}</span>
        <span style={{color:currentStars>=3?C.gold:"#ccc"}}>⭐⭐⭐≤{level.stars[2]}</span>
      </div>

      {/* 拼图区域 */}
      <div className="flex-1 flex items-center justify-center px-4">
        <div
          onTouchStart={handleTouchStart}
          onTouchEnd={handleTouchEnd}
          style={{
            width:boardPx, height:boardPx,
            position:"relative",
            background:`${C.ink}0e`,
            borderRadius:12,
            touchAction:"none",
          }}
        >
          {tiles.map((value,index)=>(
            <SceneTile
              key={value===0 ? "empty" : value}
              value={value}
              index={index}
              size={size}
              boardPx={boardPx}
              isMovable={movableIndices.includes(index)}
              onClick={handleClick}
              sceneId={level.scene}
            />
          ))}
        </div>
      </div>

      {/* 底部操作栏 */}
      <div className="flex justify-center gap-3 py-3 px-4" style={{paddingBottom:"max(12px,env(safe-area-inset-bottom))"}}>
        {[
          {label:"预览", icon:"👁", action:()=>setShowPreview(true)},
          {label:"撤销", icon:"↩", action:handleUndo, disabled:history.length===0},
          {label:"重置", icon:"🔄", action:handleReset},
        ].map(btn=>(
          <button key={btn.label} onClick={btn.action} disabled={btn.disabled}
            className="flex flex-col items-center gap-0.5 px-5 py-2 rounded-xl text-xs active:scale-90 transition-all"
            style={{
              background:C.cream, color:btn.disabled?"#ccc":C.ink,
              border:`1px solid ${C.gold}18`,
              opacity:btn.disabled?0.45:1,
              minWidth:64,
            }}>
            <span className="text-lg leading-tight">{btn.icon}</span>
            {btn.label}
          </button>
        ))}
      </div>

      {showPreview && <PreviewOverlay sceneId={level.scene} onClose={()=>setShowPreview(false)}/>}

      {done && (
        <VictoryModal
          level={level} moves={moves} time={seconds}
          onRetry={handleReset}
          onBack={onBack}
          onNext={()=>{
            onComplete(level.id, moves, seconds);
            const allLevels = CHAPTERS.flatMap(c=>c.levels);
            const idx = allLevels.findIndex(l=>l.id===level.id);
            if (idx < allLevels.length-1) {
              const next = allLevels[idx+1];
              // 找到下一关所属章节
              const nextChapter = CHAPTERS.find(c=>c.levels.some(l=>l.id===next.id));
              if (nextChapter) {
                onBack(nextChapter, next);
                return;
              }
            }
            onBack();
          }}
        />
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// 主应用
// ═══════════════════════════════════════════════════════
function App() {
  const [page, setPage] = useState("menu");
  const [chapter, setChapter] = useState(null);
  const [level, setLevel] = useState(null);
  const [progress, setProgress] = useState(()=>loadProgress());
  const [toast, setToast] = useState({msg:"", visible:false});
  const [animKey, setAnimKey] = useState(0);

  // 保存进度到 localStorage
  useEffect(()=>saveProgress(progress), [progress]);

  const navigate = (target, data1, data2)=>{
    setAnimKey(k=>k+1);
    if (target==="menu") setPage("menu");
    else if (target==="chapters") setPage("chapters");
    else if (target==="levels") { setChapter(data1); setPage("levels"); }
    else if (target==="game") { setLevel(data1); setPage("game"); }
  };

  const handleComplete = (levelId, moves, time)=>{
    const lv = CHAPTERS.flatMap(c=>c.levels).find(l=>l.id===levelId);
    if (!lv) return;
    const stars = moves<=lv.stars[2] ? 3 : moves<=lv.stars[1] ? 2 : 1;
    setProgress(prev=>{
      const existing = prev[levelId];
      if (!existing || stars>existing.stars || (stars===existing.stars && moves<existing.moves)) {
        return {...prev, [levelId]:{stars, moves, time}};
      }
      return prev;
    });
  };

  const showToast = (msg)=>{
    setToast({msg, visible:true});
    setTimeout(()=>setToast({msg:"", visible:false}), 2500);
  };

  const handleShare = async ()=>{
    const shareData = {
      title:"赣州风物志 · 滑块拼图",
      text:"一款赣州人文地理主题拼图游戏，15关带你品味赣南千年文化！",
      url: window.location.href,
    };
    if (navigator.share) {
      try {
        await navigator.share(shareData);
      } catch {}
    } else {
      try {
        await navigator.clipboard.writeText(window.location.href);
        showToast("链接已复制到剪贴板！发给朋友一起玩 🎉");
      } catch {
        showToast("复制链接：" + window.location.href);
      }
    }
  };

  return (
    <div key={animKey} className="fade-in">
      {page==="menu" && (
        <MainMenu onStart={()=>navigate("chapters")} onShare={handleShare}/>
      )}
      {page==="chapters" && (
        <ChapterSelect
          progress={progress}
          onSelect={(ch)=>navigate("levels", ch)}
          onBack={()=>navigate("menu")}
        />
      )}
      {page==="levels" && chapter && (
        <LevelSelect
          chapter={chapter}
          progress={progress}
          onSelect={(lv)=>navigate("game", lv)}
          onBack={()=>navigate("chapters")}
        />
      )}
      {page==="game" && level && chapter && (
        <GamePage
          level={level}
          chapter={chapter}
          onBack={(nextCh, nextLv)=>{
            if (nextCh && nextLv) {
              setChapter(nextCh);
              setLevel(nextLv);
            } else {
              navigate("levels", chapter);
            }
          }}
          onComplete={handleComplete}
        />
      )}
      <Toast msg={toast.msg} visible={toast.visible}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
